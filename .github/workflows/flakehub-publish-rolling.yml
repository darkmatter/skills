name: "Publish every Git push to main to FlakeHub"
on:
  push:
    branches:
      - "main"
jobs:
  flakehub-publish:
    runs-on: "arc"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v6"
        with:
          persist-credentials: false
      # No DeterminateSystems/determinate-nix-action step: the arc runner image
      # already ships Determinate Nix, so there is nothing to install.
      - uses: "DeterminateSystems/flakehub-push@main"
        with:
          name: "darkmatter/skills"
          rolling: true
          visibility: "unlisted"
          include-output-paths: true
