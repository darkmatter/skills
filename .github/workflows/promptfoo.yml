name: Promptfoo evals

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skill-evals:
    runs-on: arc
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # promptfoo 0.121.9 requires Node >=22.22.0, so pin a range that
          # excludes older cached 22.x runtimes but stays on Node 22.
          node-version: ">=22.22.0 <23"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Second pass without --ignore-scripts runs trusted native deps (the
      # better-sqlite3 prebuild promptfoo needs); untrusted stay blocked.
      - name: Build trusted native dependencies
        run: bun install --frozen-lockfile --force

      - name: Validate Promptfoo configs
        run: bun run eval:validate

      - name: Require model provider secrets
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is required for Promptfoo CI evals'; exit 1; }

      - name: Run skill evals
        run: bun run eval:ci

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-skill-evals
          path: evals/results/*
          if-no-files-found: ignore

  prompt-test-unit:
    # The real prompt-test evals (evals/prompt-tests) are LOCAL/MANUAL ONLY:
    # they make real model calls + network clones of darkmatter repos, so they
    # are not run in CI. We DO run their pure diff-assertion unit tests here,
    # which need no model and no network.
    runs-on: arc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node floor as the skill-evals job (promptfoo 0.121.9).
          node-version: ">=22.22.0 <23"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build trusted native dependencies
        run: bun install --frozen-lockfile --force

      - name: Validate Promptfoo configs
        run: bun run eval:validate

      - name: Run prompt-test assertion unit tests
        run: bun run test:prompt-tests
